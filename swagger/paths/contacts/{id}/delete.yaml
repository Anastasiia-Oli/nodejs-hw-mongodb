tags:
  - Contacts
summary: Get contact by id
operationId: deleteContact
description: 'Delete contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '68a6542b9a62e57575c48f74'
responses:
  '204':
    description: 'Contact Successfully deleted'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: Successfully deleted contact with id 68a6542b9a62e57575c48f74!
  '404':
    $ref: '../../../components/responses/404.yaml'
